<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Extractor — agent session review</title>
    <meta name="description" content="Load an agent session JSON, step the timeline, mark each tool call, and export the transcript, summary and trimmed audio under one naming convention." />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:title" content="JSON Extractor" />
    <meta property="og:description" content="Review agent sessions: timeline, tool calls, scenario check, audio trim and export." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Runs before first paint so neither the theme nor a stored palette
      // flashes. Keys and the palette shape match src/components/AppearanceMenu.tsx.
      (function () {
        var root = document.documentElement, t, p;
        try { t = localStorage.getItem('ai-json-organizer:theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        root.setAttribute('data-theme', t);
        try { p = JSON.parse(localStorage.getItem('ai-json-organizer:palette') || 'null'); } catch (e) {}
        if (p && /^#[0-9a-f]{6}$/i.test(p.seed) && typeof p.tint === 'number' && p.tint >= 0 && p.tint <= 1) {
          root.style.setProperty('--accent-seed', p.seed);
          root.style.setProperty('--tint', String(p.tint));
          root.setAttribute('data-palette', typeof p.id === 'string' ? p.id : 'custom');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
